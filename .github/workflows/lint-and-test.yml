name: iOS Build and Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - name: Test native VIA client and alarm state
      run: swift test --package-path ios
    - name: Build standalone iPhone app
      run: >-
        xcodebuild -project ios/ReveilVIA.xcodeproj -scheme ReveilVIA
        -destination 'generic/platform=iOS Simulator'
        CODE_SIGNING_ALLOWED=NO build
