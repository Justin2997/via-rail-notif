name: iOS Build and Tests

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Scan Git history for secrets
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$archive"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Test native VIA client and alarm state
      run: swift test --package-path ios
    - name: Build standalone iPhone app
      run: >-
        xcodebuild -project ios/ReveilVIA.xcodeproj -scheme ReveilVIA
        -destination 'generic/platform=iOS Simulator'
        CODE_SIGNING_ALLOWED=NO build
    - name: Validate Release archive for distribution
      run: >-
        xcodebuild -project ios/ReveilVIA.xcodeproj -scheme ReveilVIA
        -configuration Release -destination 'generic/platform=iOS'
        -archivePath "$RUNNER_TEMP/ReveilVIA.xcarchive"
        CODE_SIGNING_ALLOWED=NO archive
